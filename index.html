<style>
:root {
  --bg: #f7f4ec; --bg-2: #efeadc; --surface: #ffffff; --surface-2: #f3eee0;
  --border: rgba(80,60,30,0.10); --border-strong: rgba(80,60,30,0.20);
  --text: #2a2520; --text-2: #6b6358; --text-3: #9a9286;
  --accent: #4a3f2e; --accent-soft: #6b5b3e;
  --info-bg: #e6f1fb; --info-tx: #0c447c;
  --warn-bg: #faeeda; --warn-tx: #854f0b;
  --ok-bg: #eaf3de; --ok-tx: #27500a;
  --danger-bg: #fcebeb; --danger-tx: #791f1f;
  --neutral-bg: #ebe4d2; --neutral-tx: #6b6358;
  --radius: 8px; --radius-lg: 12px; --radius-xl: 16px; --sidebar-w: 240px;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: var(--bg); color: var(--text);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
.login-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 32px; max-width: 380px; width: 100%; box-shadow: 0 8px 32px rgba(80,60,30,0.06); }
.login-card h1 { font-size: 22px; font-weight: 700; margin: 0 0 4px; letter-spacing: -0.01em; }
.login-card p { font-size: 14px; color: var(--text-2); margin: 0 0 24px; }
.login-card form { display: flex; flex-direction: column; gap: 12px; }
.login-card label { font-size: 12px; color: var(--text-2); font-weight: 500; }
.login-card input { padding: 12px 14px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text); font-family: inherit; font-size: 15px; width: 100%; }
.login-card input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.login-error { background: var(--danger-bg); color: var(--danger-tx); padding: 10px 14px; border-radius: var(--radius); font-size: 13px; display: none; }
.login-error.show { display: block; }
.layout { display: flex; min-height: 100vh; }
.sidebar { width: var(--sidebar-w); flex-shrink: 0; background: var(--bg-2); border-right: 1px solid var(--border); padding: 24px 16px; position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
.sidebar-brand { padding: 0 8px 20px; border-bottom: 1px solid var(--border); margin-bottom: 16px; }
.sidebar-brand h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.sidebar-brand p { font-size: 12px; color: var(--text-2); margin: 4px 0 0; }
.nav-section-label { font-size: 10.5px; font-weight: 600; color: var(--text-3); letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 8px 6px; margin-top: 8px; }
.nav-btn { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: none; background: transparent; color: var(--text-2); font-family: inherit; font-size: 14px; font-weight: 500; text-align: left; border-radius: var(--radius); cursor: pointer; margin-bottom: 1px; }
.nav-btn:hover { background: var(--surface-2); color: var(--text); }
.nav-btn.active { background: var(--surface); color: var(--text); box-shadow: 0 1px 0 var(--border); }
.nav-btn .icon { font-size: 18px; flex-shrink: 0; }
.nav-btn .nav-emoji { font-size: 16px; flex-shrink: 0; width: 18px; text-align: center; }
.nav-btn .nav-badge { margin-left: auto; font-size: 11px; background: var(--danger-bg); color: var(--danger-tx); padding: 1px 7px; border-radius: 999px; font-weight: 600; }
.nav-objekt { padding-left: 8px; font-size: 13.5px; }
.sidebar-footer { margin-top: auto; padding: 12px 8px 4px; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-3); }
.sync-status { font-size: 11px; color: var(--text-3); margin-bottom: 8px; padding: 4px 8px; min-height: 20px; }
.sync-status.syncing { color: var(--info-tx); }
.sync-status.error { color: var(--danger-tx); }
.sync-status.success { color: var(--ok-tx); }
.logout-btn { margin-top: 8px; background: transparent; border: 1px solid var(--border); color: var(--text-2); padding: 6px 10px; border-radius: var(--radius); font-family: inherit; font-size: 12px; cursor: pointer; width: 100%; }
.logout-btn:hover { background: var(--surface-2); }
.mobile-topbar { display: none; background: var(--bg-2); border-bottom: 1px solid var(--border); padding: 12px 16px; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 20; }
.menu-btn { background: transparent; border: none; cursor: pointer; padding: 6px; color: var(--text); font-size: 22px; line-height: 1; }
.mobile-brand { font-size: 15px; font-weight: 600; margin: 0; }
.sidebar-backdrop { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90; }
@media (max-width: 900px) {
  .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 100; transform: translateX(-100%); transition: transform 0.25s ease; box-shadow: 2px 0 20px rgba(0,0,0,0.1); }
  .sidebar.open { transform: translateX(0); }
  .sidebar.open ~ .sidebar-backdrop { display: block; }
  .mobile-topbar { display: flex; }
  .layout { flex-direction: column; }
}
.main { flex: 1; min-width: 0; padding: 32px 40px 64px; }
@media (max-width: 900px) { .main { padding: 16px 16px 64px; } }
.loading-state { display: flex; align-items: center; justify-content: center; min-height: 60vh; color: var(--text-2); }
.spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 12px; }
@keyframes spin { to { transform: rotate(360deg); } }
.page-head { margin-bottom: 24px; }
.page-head h2 { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
.page-head .subtitle { font-size: 14px; color: var(--text-2); margin: 4px 0 0; }
.breadcrumb { font-size: 13px; color: var(--text-2); margin-bottom: 12px; }
.breadcrumb a, .breadcrumb button { color: var(--text-2); background: transparent; border: none; cursor: pointer; padding: 0; font-family: inherit; font-size: inherit; }
.breadcrumb a:hover, .breadcrumb button:hover { color: var(--text); }
.breadcrumb .sep { margin: 0 6px; color: var(--text-3); }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 32px; }
.stat { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 18px; }
.stat-label { font-size: 12px; color: var(--text-2); margin: 0; font-weight: 500; }
.stat-value { font-size: 28px; font-weight: 700; margin: 6px 0 0; letter-spacing: -0.02em; }
.stat-value.danger { color: var(--danger-tx); }
.stat-value.success { color: var(--ok-tx); }
.stat-sub { font-size: 11.5px; color: var(--text-3); margin: 2px 0 0; }
.objekt-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.objekt-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); overflow: hidden; cursor: pointer; transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s; display: flex; flex-direction: column; }
.objekt-tile:hover { border-color: var(--border-strong); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(80,60,30,0.06); }
.objekt-tile-head { padding: 18px 20px; background: var(--surface-2); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
.objekt-emoji { font-size: 32px; line-height: 1; width: 48px; height: 48px; border-radius: var(--radius-lg); background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.objekt-tile-name { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.objekt-tile-sub { font-size: 12px; color: var(--text-2); margin: 2px 0 0; }
.objekt-tile-body { padding: 16px 20px; flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
.objekt-tile-stat .lbl { font-size: 11px; color: var(--text-2); margin: 0; font-weight: 500; }
.objekt-tile-stat .val { font-size: 16px; font-weight: 600; margin: 2px 0 0; letter-spacing: -0.01em; }
.objekt-tile-stat .val.warn { color: var(--warn-tx); }
.objekt-tile-stat .val.danger { color: var(--danger-tx); }
.section-title { font-size: 16px; font-weight: 600; margin: 32px 0 12px; display: flex; justify-content: space-between; align-items: center; letter-spacing: -0.01em; }
.section-title:first-child { margin-top: 0; }
.section-title button { font-size: 13px; font-weight: 500; padding: 7px 14px; border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); border-radius: 999px; cursor: pointer; font-family: inherit; display: inline-flex; align-items: center; gap: 4px; }
.section-title button:hover { background: var(--surface-2); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px 16px; margin-bottom: 8px; transition: border-color 0.15s; }
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--border-strong); }
.schaden-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 4px; }
.schaden-title { font-weight: 500; font-size: 14.5px; margin: 0; flex: 1; }
.schaden-meta { font-size: 12.5px; color: var(--text-2); margin: 2px 0 0; }
.schaden-sub { font-size: 11.5px; color: var(--text-3); margin: 4px 0 0; }
.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 4px; white-space: nowrap; letter-spacing: 0.01em; }
.b-offen { background: var(--warn-bg); color: var(--warn-tx); }
.b-progress { background: var(--info-bg); color: var(--info-tx); }
.b-erledigt { background: var(--ok-bg); color: var(--ok-tx); }
.b-dringend { background: var(--danger-bg); color: var(--danger-tx); }
.b-mittel { background: var(--warn-bg); color: var(--warn-tx); }
.b-niedrig { background: var(--neutral-bg); color: var(--neutral-tx); }
.filters { display: flex; gap: 6px; margin-bottom: 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; flex-wrap: wrap; }
.filters::-webkit-scrollbar { display: none; }
.pill { padding: 7px 14px; font-size: 13px; font-weight: 500; border: 1px solid var(--border); background: var(--surface); border-radius: 999px; cursor: pointer; font-family: inherit; color: var(--text-2); white-space: nowrap; }
.pill:hover { color: var(--text); }
.pill.active { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.objekt-detail-head { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
.objekt-detail-emoji { font-size: 44px; line-height: 1; width: 68px; height: 68px; border-radius: var(--radius-xl); background: var(--surface-2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.objekt-detail-info h2 { font-size: 26px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
.objekt-detail-info p { font-size: 14px; color: var(--text-2); margin: 2px 0 0; }
.einheit-list { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; }
.einheit { padding: 14px 18px; border-top: 1px solid var(--border); cursor: pointer; transition: background 0.1s; }
.einheit:first-of-type { border-top: none; }
.einheit:hover { background: var(--surface-2); }
.einheit.expanded { background: var(--surface-2); }
.einheit-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.einheit-info { min-width: 0; flex: 1; }
.einheit-name { font-weight: 600; font-size: 14px; }
.einheit-mieter { color: var(--text-2); font-size: 13px; margin: 2px 0 0; }
.einheit-stats { font-size: 11.5px; color: var(--text-3); margin: 4px 0 0; }
.einheit-rent { text-align: right; font-size: 14px; font-weight: 600; white-space: nowrap; }
.einheit-rent-sub { font-size: 11px; color: var(--text-3); font-weight: 400; margin-top: 2px; }
.einheit-detail { display: none; padding: 16px 18px 6px; background: var(--surface); border-radius: var(--radius); margin: 12px 0 0; border: 1px solid var(--border); }
.einheit.expanded .einheit-detail { display: block; }
.detail-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px 18px; margin-bottom: 14px; }
.detail-grid-item .lbl { font-size: 11px; color: var(--text-2); margin: 0; font-weight: 500; }
.detail-grid-item .val { font-size: 14px; font-weight: 500; margin: 2px 0 0; }
.rent-future { border-top: 1px solid var(--border); padding-top: 12px; margin-top: 4px; }
.rent-future-title { font-size: 11px; color: var(--text-2); margin: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; }
.rent-step { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; padding: 5px 0; border-bottom: 1px solid var(--border); }
.rent-step:last-child { border-bottom: none; }
.rent-step-date { color: var(--text-2); }
.rent-step-val { font-weight: 600; }
.rent-step-delta { font-size: 11.5px; color: var(--ok-tx); margin-left: 6px; font-weight: 500; }

.modal-bg { position: fixed; inset: 0; background: rgba(40,30,15,0.45); z-index: 200; display: flex; align-items: flex-end; justify-content: center; -webkit-tap-highlight-color: transparent; backdrop-filter: blur(2px); }
@media (min-width: 600px) { .modal-bg { align-items: center; } }
.modal { background: var(--surface); border-radius: var(--radius-lg) var(--radius-lg) 0 0; padding: 16px 20px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-height: 92vh; overflow-y: auto; }
@media (min-width: 600px) { .modal { max-width: 560px; border-radius: var(--radius-lg); margin: 16px; max-height: 88vh; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; position: sticky; top: -16px; background: var(--surface); padding: 12px 0 8px; margin-top: -12px; z-index: 1; }
.modal-title { font-size: 18px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.icon-btn { background: transparent; border: none; cursor: pointer; padding: 8px; border-radius: var(--radius); font-size: 20px; line-height: 1; color: var(--text-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; font-weight: 500; }
.field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border-strong); border-radius: var(--radius); background: var(--surface); color: var(--text); font-family: inherit; font-size: 14px; }
.field textarea { resize: vertical; min-height: 60px; }
.field input:focus, .field select:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
.btn { padding: 9px 16px; border-radius: var(--radius); border: 1px solid var(--border-strong); background: var(--surface); color: var(--text); font-family: inherit; font-size: 13.5px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { background: var(--surface-2); }
.btn-primary { background: var(--accent); color: #fdfaf2; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-soft); }
.btn-primary:disabled { opacity: 0.6; cursor: wait; }
.btn-danger { color: var(--danger-tx); }
.modal-section-label { font-size: 11px; color: var(--text-2); margin: 12px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; }
.modal-section-value { margin: 0 0 8px; font-size: 14px; }
.photo-grid { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.photo-thumb { width: 64px; height: 64px; object-fit: cover; border-radius: var(--radius); border: 1px solid var(--border); cursor: pointer; }
.photo-add { width: 64px; height: 64px; border: 1px dashed var(--border-strong); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-3); font-size: 22px; }
.photo-add input { display: none; }
.photo-add:hover { color: var(--text); border-color: var(--text-2); }
.photo-uploading { width: 64px; height: 64px; border: 1px solid var(--border); border-radius: var(--radius); display: flex; align-items: center; justify-content: center; background: var(--surface-2); }
.photo-uploading .spinner { width: 20px; height: 20px; border-width: 2px; margin: 0; }
.timeline { background: var(--surface-2); border-radius: var(--radius); padding: 4px 12px; margin-bottom: 14px; }
.timeline-entry { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.timeline-entry:last-child { border-bottom: none; }
.timeline-date { font-size: 11px; color: var(--text-2); margin: 0 0 2px; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; }
.list-card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
.ti { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style>

<script>
const API_BASE = 'https://backend.familie-rein.workers.dev';
const TOKEN_KEY = 'immo_auth_token';

async function apiCall(path, options = {}) {
  const token = localStorage.getItem(TOKEN_KEY);
  const headers = { ...options.headers };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (options.body && typeof options.body === 'string') headers['Content-Type'] = 'application/json';
  const res = await fetch(API_BASE + path, { ...options, headers });
  if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); showLogin(); throw new Error('Nicht angemeldet'); }
  if (!res.ok) { const err = await res.json().catch(() => ({ error: 'Server-Fehler' })); throw new Error(err.error || 'Fehler'); }
  return res;
}

async function apiLogin(password) {
  const res = await fetch(API_BASE + '/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password }) });
  if (!res.ok) { const err = await res.json().catch(() => ({})); throw new Error(err.error || 'Falsches Passwort'); }
  const data = await res.json();
  localStorage.setItem(TOKEN_KEY, data.token);
  return data;
}
async function apiGetState() { const res = await apiCall('/api/state'); return res.json(); }
async function apiPutState(s) { await apiCall('/api/state', { method: 'PUT', body: JSON.stringify(s) }); }
async function apiUploadFoto(blob, contentType) {
  const res = await apiCall('/api/foto', { method: 'POST', body: blob, headers: { 'Content-Type': contentType } });
  return res.json();
}
function fotoUrl(id) { return API_BASE + '/api/foto/' + id; }

let state = null, currentView = 'dashboard', currentObjektId = null, modalOpen = null, listFilter = 'alle', expandedEinheit = null, syncStatus = 'idle', syncTimer = null;

function setSyncStatus(s) { syncStatus = s; updateSyncStatusUI(); }
function updateSyncStatusUI() {
  const el = document.getElementById('sync-status'); if (!el) return;
  el.className = 'sync-status ' + syncStatus;
  if (syncStatus === 'syncing') el.textContent = '⟳ Synchronisiere...';
  else if (syncStatus === 'error') el.textContent = '⚠ Sync-Fehler';
  else if (syncStatus === 'success') el.textContent = '✓ Gespeichert';
  else el.textContent = '';
}
async function syncToServer() {
  setSyncStatus('syncing');
  try { await apiPutState(state); setSyncStatus('success'); setTimeout(() => { if (syncStatus === 'success') setSyncStatus('idle'); }, 1500); }
  catch (e) { console.error('Sync fehlgeschlagen:', e); setSyncStatus('error'); }
}
function scheduleSyncSoon() { clearTimeout(syncTimer); syncTimer = setTimeout(syncToServer, 800); }

function uid() { return 's' + Date.now() + Math.floor(Math.random()*1000); }
function heute() { return new Date().toISOString().slice(0,10); }
function findObjekt(id) { return state.objekte.find(o=>o.id===id); }
function findEinheit(objId, einId) { const o = findObjekt(objId); return o ? o.einheiten.find(e=>e.id===einId) : null; }
function findHandwerker(id) { return state.handwerker.find(h=>h.id===id); }
function escapeHtml(s) { return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function fmtEuro(n) { return (n||0).toLocaleString('de-DE', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' €'; }
function fmtEuroInt(n) { return Math.round(n||0).toLocaleString('de-DE') + ' €'; }
function getOffeneSchaeden(objId) { return state.schaeden.filter(s => s.objektId===objId && s.status!=='erledigt'); }

function showLogin() {
  state = null;
  document.getElementById('app-root').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h1>Immobilien-Verwaltung</h1>
        <p>Familie Rein GbR</p>
        <form id="login-form">
          <div><label for="pw">Passwort</label><input type="password" id="pw" name="password" autocomplete="current-password" required autofocus /></div>
          <div class="login-error" id="login-error"></div>
          <button type="submit" class="btn btn-primary" style="justify-content: center; margin-top: 4px;">Anmelden</button>
        </form>
      </div>
    </div>`;
  document.getElementById('login-form').onsubmit = async (e) => {
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const errEl = document.getElementById('login-error');
    const btn = e.target.querySelector('button');
    errEl.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Prüfe...';
    try { await apiLogin(pw); await loadAndRender(); }
    catch (err) { errEl.textContent = err.message || 'Anmeldung fehlgeschlagen'; errEl.classList.add('show'); btn.disabled = false; btn.textContent = 'Anmelden'; }
  };
}
function logout() { localStorage.removeItem(TOKEN_KEY); showLogin(); }

async function loadAndRender() {
  document.getElementById('app-root').innerHTML = `<div class="loading-state"><div class="spinner"></div><span>Lade Daten...</span></div>`;
  try { state = await apiGetState(); renderApp(); }
  catch (e) {
    if (e.message === 'Nicht angemeldet') return;
    document.getElementById('app-root').innerHTML = `<div class="loading-state" style="flex-direction: column; gap: 16px;"><p style="color: var(--danger-tx);">Fehler beim Laden: ${escapeHtml(e.message)}</p><button class="btn" onclick="loadAndRender()">Erneut versuchen</button></div>`;
  }
}
window.loadAndRender = loadAndRender;

function renderApp() {
  document.getElementById('app-root').innerHTML = `
    <div class="layout">
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand"><h1>Familie Rein GbR</h1><p>Immobilien-Verwaltung</p></div>
        <div class="nav-section-label">Navigation</div>
        <button class="nav-btn" data-view="dashboard"><svg class="ti icon"><use href="#i-home"/></svg>Übersicht</button>
        <button class="nav-btn" data-view="schaeden"><svg class="ti icon"><use href="#i-tools"/></svg>Alle Schäden<span class="nav-badge" id="nav-schaden-count">0</span></button>
        <button class="nav-btn" data-view="handwerker"><svg class="ti icon"><use href="#i-user"/></svg>Handwerker</button>
        <button class="nav-btn" data-view="wartung"><svg class="ti icon"><use href="#i-cal"/></svg>Wartung</button>
        <div class="nav-section-label">Objekte</div>
        <div id="nav-objekte"></div>
        <div class="sidebar-footer">
          <div class="sync-status" id="sync-status"></div>
          <span>${state.objekte.reduce((a,o)=>a+o.einheiten.length,0)} Einheiten · ${state.objekte.length} Objekte</span>
          <button class="logout-btn" id="logout-btn">Abmelden</button>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
      <div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
        <div class="mobile-topbar"><button class="menu-btn" id="menu-btn"><svg class="ti"><use href="#i-menu"/></svg></button><p class="mobile-brand">Familie Rein GbR</p></div>
        <main class="main" id="view-container"></main>
      </div>
    </div>`;
  document.getElementById('menu-btn').onclick = ()=>{ document.getElementById('sidebar').classList.toggle('open'); };
  document.getElementById('sidebar-backdrop').onclick = ()=>{ document.getElementById('sidebar').classList.remove('open'); };
  document.getElementById('logout-btn').onclick = logout;
  render();
}

function render() {
  if (!state) return;
  renderSidebar();
  const c = document.getElementById('view-container');
  if (currentView==='dashboard') c.innerHTML = renderDashboard();
  else if (currentView==='schaeden') c.innerHTML = renderSchaeden();
  else if (currentView==='objekt') c.innerHTML = renderObjektDetail();
  else if (currentView==='handwerker') c.innerHTML = renderHandwerker();
  else if (currentView==='wartung') c.innerHTML = renderWartung();
  bindHandlers(); renderModal(); window.scrollTo(0,0); updateSyncStatusUI();
}

function renderSidebar() {
  const totalOffen = state.schaeden.filter(s=>s.status!=='erledigt').length;
  const badge = document.getElementById('nav-schaden-count');
  if (totalOffen > 0) { badge.textContent = totalOffen; badge.style.display = ''; } else { badge.style.display = 'none'; }
  const navObjekte = document.getElementById('nav-objekte');
  navObjekte.innerHTML = state.objekte.map(o=>{
    const offen = getOffeneSchaeden(o.id).length;
    const isActive = currentView==='objekt' && currentObjektId===o.id;
    return `<button class="nav-btn nav-objekt ${isActive?'active':''}" data-objekt="${o.id}">
      <span class="nav-emoji">${o.emoji||'🏠'}</span>
      <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${escapeHtml(o.name)}</span>
      ${offen>0?`<span class="nav-badge">${offen}</span>`:''}
    </button>`;
  }).join('');
  document.querySelectorAll('.sidebar > .nav-btn').forEach(b=>{ b.classList.toggle('active', b.dataset.view===currentView && currentView!=='objekt'); });
  document.querySelectorAll('[data-objekt]').forEach(b=>{
    b.onclick = ()=>{ currentView = 'objekt'; currentObjektId = b.dataset.objekt; expandedEinheit = null; document.getElementById('sidebar').classList.remove('open'); render(); };
  });
}

function renderDashboard() {
  const offen = state.schaeden.filter(s=>s.status==='offen').length;
  const inProgress = state.schaeden.filter(s=>s.status==='in_bearbeitung').length;
  const dringend = state.schaeden.filter(s=>s.prioritaet==='dringend' && s.status!=='erledigt').length;
  const kostenJahr = state.schaeden.filter(s=>s.erstellt && s.erstellt.startsWith('2025')).reduce((a,s)=>a+(s.kosten||0),0);
  let monatsEinnahmen = 0;
  state.objekte.forEach(o => o.einheiten.forEach(e => monatsEinnahmen += (e.kmMonat||0)));
  const dringendeSchaeden = state.schaeden.filter(s=>s.status!=='erledigt' && s.prioritaet==='dringend');
  return `
    <div class="page-head"><h2>Übersicht</h2><p class="subtitle">Stand ${new Date().toLocaleDateString('de-DE',{day:'numeric',month:'long',year:'numeric'})}</p></div>
    <div class="stats">
      <div class="stat"><p class="stat-label">Offen</p><p class="stat-value">${offen}</p><p class="stat-sub">Schäden warten</p></div>
      <div class="stat"><p class="stat-label">In Bearbeitung</p><p class="stat-value">${inProgress}</p><p class="stat-sub">Handwerker beauftragt</p></div>
      <div class="stat"><p class="stat-label">Dringend</p><p class="stat-value ${dringend>0?'danger':''}">${dringend}</p><p class="stat-sub">Hohe Priorität</p></div>
      <div class="stat"><p class="stat-label">Reparaturkosten 2025</p><p class="stat-value">${fmtEuroInt(kostenJahr)}</p><p class="stat-sub">Bisher</p></div>
      <div class="stat"><p class="stat-label">Mieteinnahmen / Monat</p><p class="stat-value success">${fmtEuroInt(monatsEinnahmen)}</p><p class="stat-sub">Netto-Kaltmiete</p></div>
    </div>
    ${dringendeSchaeden.length>0?`<div class="section-title">Dringende Schäden<button data-action="new-schaden"><svg class="ti"><use href="#i-plus"/></svg> Neu</button></div>${dringendeSchaeden.map(renderSchadenCard).join('')}`:''}
    <div class="section-title">Objekte ${dringendeSchaeden.length===0?`<button data-action="new-schaden"><svg class="ti"><use href="#i-plus"/></svg> Neuer Schaden</button>`:''}</div>
    <div class="objekt-grid">${state.objekte.map(renderObjektTile).join('')}</div>`;
}

function renderObjektTile(o) {
  const offen = getOffeneSchaeden(o.id).length;
  const totalM2 = o.einheiten.reduce((a,e)=>a+(e.m2||0), 0);
  const totalMiete = o.einheiten.reduce((a,e)=>a+(e.kmMonat||0), 0);
  return `<div class="objekt-tile" data-action="goto-objekt" data-id="${o.id}">
    <div class="objekt-tile-head"><div class="objekt-emoji">${o.emoji||'🏠'}</div><div style="min-width: 0;"><p class="objekt-tile-name">${escapeHtml(o.name)}</p><p class="objekt-tile-sub">${o.einheiten.length} Einheiten · ${totalM2.toFixed(0)} m²</p></div></div>
    <div class="objekt-tile-body">
      <div class="objekt-tile-stat"><p class="lbl">Mieteinnahmen / Monat</p><p class="val">${fmtEuroInt(totalMiete)}</p></div>
      <div class="objekt-tile-stat"><p class="lbl">Offene Schäden</p><p class="val ${offen>0?'warn':''}">${offen===0?'Keine':offen}</p></div>
    </div>
  </div>`;
}

function renderSchadenCard(s) {
  const obj = findObjekt(s.objektId);
  const ein = findEinheit(s.objektId, s.einheitId);
  const statusBadge = s.status==='offen'?'<span class="badge b-offen">Offen</span>':s.status==='in_bearbeitung'?'<span class="badge b-progress">In Bearbeitung</span>':'<span class="badge b-erledigt">Erledigt</span>';
  const prioBadge = s.prioritaet==='dringend'?'<span class="badge b-dringend">Dringend</span>':s.prioritaet==='mittel'?'<span class="badge b-mittel">Mittel</span>':'<span class="badge b-niedrig">Niedrig</span>';
  return `<div class="card clickable" data-action="open-schaden" data-id="${s.id}">
    <div class="schaden-head"><p class="schaden-title">${escapeHtml(s.titel)}</p><div class="badges">${prioBadge}${statusBadge}</div></div>
    <p class="schaden-meta">${obj?(obj.emoji||'🏠')+' '+escapeHtml(obj.name):'?'} · ${escapeHtml(ein?ein.bez:'?')} · ${escapeHtml(ein?ein.mieter:'')}</p>
    <p class="schaden-sub">${escapeHtml(s.kategorie||'')} · seit ${s.erstellt}${s.kosten?' · '+fmtEuroInt(s.kosten):''}</p>
  </div>`;
}

function renderSchaeden() {
  let liste = state.schaeden.slice().sort((a,b)=>(b.erstellt||'').localeCompare(a.erstellt||''));
  if (listFilter==='offen') liste = liste.filter(s=>s.status==='offen');
  else if (listFilter==='progress') liste = liste.filter(s=>s.status==='in_bearbeitung');
  else if (listFilter==='erledigt') liste = liste.filter(s=>s.status==='erledigt');
  return `
    <div class="page-head"><h2>Alle Schäden</h2><p class="subtitle">Alle Reparaturen über alle Objekte hinweg</p></div>
    <div class="filters" style="justify-content: space-between;">
      <div style="display: flex; gap: 6px; flex-wrap: wrap;">
        <button class="pill ${listFilter==='alle'?'active':''}" data-filter="alle">Alle (${state.schaeden.length})</button>
        <button class="pill ${listFilter==='offen'?'active':''}" data-filter="offen">Offen (${state.schaeden.filter(s=>s.status==='offen').length})</button>
        <button class="pill ${listFilter==='progress'?'active':''}" data-filter="progress">In Bearbeitung (${state.schaeden.filter(s=>s.status==='in_bearbeitung').length})</button>
        <button class="pill ${listFilter==='erledigt'?'active':''}" data-filter="erledigt">Erledigt (${state.schaeden.filter(s=>s.status==='erledigt').length})</button>
      </div>
      <button class="btn btn-primary" data-action="new-schaden"><svg class="ti"><use href="#i-plus"/></svg> Neuer Schaden</button>
    </div>
    ${liste.length===0?'<div class="empty">Keine Einträge in dieser Kategorie</div>':liste.map(renderSchadenCard).join('')}`;
}

function renderObjektDetail() {
  const o = findObjekt(currentObjektId);
  if (!o) return '<p>Objekt nicht gefunden</p>';
  const offeneSchaeden = getOffeneSchaeden(o.id);
  const erledigte = state.schaeden.filter(s => s.objektId===o.id && s.status==='erledigt');
  const totalM2 = o.einheiten.reduce((a,e)=>a+(e.m2||0), 0);
  const totalMiete = o.einheiten.reduce((a,e)=>a+(e.kmMonat||0), 0);
  const totalNK = o.einheiten.reduce((a,e)=>a+(e.nkMonat||0), 0);
  const leerstand = o.einheiten.filter(e => !e.kmMonat || e.kmMonat===0).length;
  return `
    <div class="breadcrumb"><button data-action="goto-dashboard">Übersicht</button><span class="sep">›</span><span style="color: var(--text);">${escapeHtml(o.name)}</span></div>
    <div class="objekt-detail-head"><div class="objekt-detail-emoji">${o.emoji||'🏠'}</div><div class="objekt-detail-info"><h2>${escapeHtml(o.name)}</h2><p>${o.einheiten.length} Einheiten · ${totalM2.toFixed(0)} m² Wohnfläche${leerstand>0?' · '+leerstand+' Leerstand':''}</p></div></div>
    <div class="stats">
      <div class="stat"><p class="stat-label">Mieteinnahmen / Monat</p><p class="stat-value success">${fmtEuroInt(totalMiete)}</p><p class="stat-sub">Netto-Kaltmiete</p></div>
      <div class="stat"><p class="stat-label">Nebenkosten / Monat</p><p class="stat-value">${fmtEuroInt(totalNK)}</p></div>
      <div class="stat"><p class="stat-label">Offene Schäden</p><p class="stat-value ${offeneSchaeden.length>0?'warn':''}">${offeneSchaeden.length}</p></div>
      <div class="stat"><p class="stat-label">Jahres-NKM</p><p class="stat-value">${fmtEuroInt(totalMiete*12)}</p></div>
    </div>
    ${offeneSchaeden.length>0?`<div class="section-title">Offene Schäden<button data-action="new-schaden-fuer-objekt" data-id="${o.id}"><svg class="ti"><use href="#i-plus"/></svg> Neu</button></div>${offeneSchaeden.map(renderSchadenCard).join('')}`:`<div class="section-title">Schäden<button data-action="new-schaden-fuer-objekt" data-id="${o.id}"><svg class="ti"><use href="#i-plus"/></svg> Schaden anlegen</button></div><div class="empty">Keine offenen Schäden in diesem Objekt 🎉</div>`}
    <div class="section-title">Einheiten</div>
    <div class="einheit-list">${o.einheiten.map(e=>renderEinheitRow(o, e)).join('')}</div>
    ${erledigte.length>0?`<div class="section-title">Erledigte Schäden</div>${erledigte.slice(0,5).map(renderSchadenCard).join('')}`:''}`;
}

function renderEinheitRow(o, e) {
  const eOffen = state.schaeden.filter(s=>s.einheitId===e.id && s.status!=='erledigt').length;
  const expanded = expandedEinheit===e.id;
  const naechste = e.naechste || [];
  const naechsteErhoehung = naechste.filter(n => {
    if (!n.datum) return false;
    const parts = n.datum.split('.');
    return parts.length===3 && new Date(parts[2]+'-'+parts[1]+'-'+parts[0]) > new Date();
  })[0];
  return `<div class="einheit ${expanded?'expanded':''}" data-action="toggle-einheit" data-id="${e.id}">
    <div class="einheit-row">
      <div class="einheit-info">
        <div class="einheit-name">${escapeHtml(e.id)} · ${escapeHtml(e.bez)}</div>
        <div class="einheit-mieter">${escapeHtml(e.mieter)}</div>
        <div class="einheit-stats">${e.m2} m² · ${(e.kmM2||0).toFixed(2).replace('.',',')} €/m²${eOffen>0?' · <span class="badge b-offen" style="margin-left:4px;">'+eOffen+' offen</span>':''}</div>
      </div>
      <div class="einheit-rent">${fmtEuroInt(e.kmMonat)}/Mo${naechsteErhoehung?`<div class="einheit-rent-sub">↑ ab ${naechsteErhoehung.datum.slice(3)}</div>`:''}</div>
    </div>
    <div class="einheit-detail">
      <div class="detail-grid">
        <div class="detail-grid-item"><p class="lbl">Wohnfläche</p><p class="val">${e.m2} m²</p></div>
        <div class="detail-grid-item"><p class="lbl">Typ</p><p class="val">${escapeHtml(e.typ)}</p></div>
        <div class="detail-grid-item"><p class="lbl">Netto-Kaltmiete / Monat</p><p class="val">${fmtEuro(e.kmMonat)}</p></div>
        <div class="detail-grid-item"><p class="lbl">Nebenkosten / Monat</p><p class="val">${fmtEuro(e.nkMonat)}</p></div>
        <div class="detail-grid-item"><p class="lbl">€ pro m²</p><p class="val">${(e.kmM2||0).toFixed(2).replace('.',',')} €</p></div>
        <div class="detail-grid-item"><p class="lbl">Letzte Erhöhung</p><p class="val" style="font-size: 12px;">${escapeHtml(e.letzteErhoehung)}</p></div>
      </div>
      ${naechste.length>0 ? `<div class="rent-future"><p class="rent-future-title">Geplante Mieterhöhungen</p>${naechste.map(n=>`<div class="rent-step"><span class="rent-step-date">${n.datum}</span><span class="rent-step-val">${(n.neuKmM2||0).toFixed(2).replace('.',',')} €/m² <span class="rent-step-delta">+${n.prozent}% von ${(n.alt||0).toFixed(2).replace('.',',')} €</span></span></div>`).join('')}</div>` : ''}
      <div style="margin-top: 12px; display: flex; gap: 6px; padding-bottom: 4px;">
        <button class="btn" data-action="schaden-fuer" data-obj="${o.id}" data-ein="${e.id}" style="font-size: 12.5px;">+ Schaden anlegen</button>
      </div>
    </div>
  </div>`;
}

function renderHandwerker() {
  return `
    <div class="page-head"><h2>Handwerker</h2><p class="subtitle">Kontaktdaten und Auftragshistorie</p></div>
    <div class="section-title" style="margin-top: 0;">${state.handwerker.length} Kontakte<button data-action="new-handwerker"><svg class="ti"><use href="#i-plus"/></svg> Neu</button></div>
    ${state.handwerker.length===0?'<div class="empty">Noch keine Handwerker eingetragen</div>':`<div class="list-card-grid">${state.handwerker.map(h=>{
      const auftraege = state.schaeden.filter(s=>s.handwerkerId===h.id).length;
      return `<div class="card"><div style="display: flex; justify-content: space-between; align-items: flex-start;"><div style="min-width: 0;"><p style="margin: 0; font-weight: 600;">${escapeHtml(h.name)}</p><p style="margin: 2px 0 0; font-size: 12.5px; color: var(--text-2);">${escapeHtml(h.gewerk)} · ${escapeHtml(h.tel)}</p>${h.notiz?`<p style="margin: 8px 0 0; font-size: 12px; color: var(--text-3);">${escapeHtml(h.notiz)}</p>`:''}</div><span class="badge b-niedrig">${auftraege} Aufträge</span></div></div>`;
    }).join('')}</div>`}`;
}

function renderWartung() {
  const sortiert = state.wartung.slice().sort((a,b)=>(a.naechster||'').localeCompare(b.naechster||''));
  return `
    <div class="page-head"><h2>Wartung</h2><p class="subtitle">Wiederkehrende Termine und Erinnerungen</p></div>
    <div class="section-title" style="margin-top: 0;">Anstehende Termine<button data-action="new-wartung"><svg class="ti"><use href="#i-plus"/></svg> Neu</button></div>
    ${sortiert.length===0?'<div class="empty">Noch keine Wartungstermine</div>':`<div class="list-card-grid">${sortiert.map(w=>{
      const obj = w.objektId?findObjekt(w.objektId):null;
      const naechster = new Date(w.naechster);
      const tage = Math.ceil((naechster - new Date())/86400000);
      const tageText = tage<0?`<span style="color: var(--danger-tx); font-weight: 600;">${Math.abs(tage)} Tage überfällig</span>`:tage<30?`<span style="color: var(--warn-tx); font-weight: 500;">in ${tage} Tagen</span>`:`in ${tage} Tagen`;
      return `<div class="card"><p style="margin: 0; font-weight: 600;">${escapeHtml(w.titel)}</p><p style="margin: 4px 0 0; font-size: 12.5px; color: var(--text-2);">${obj?(obj.emoji||'')+' '+escapeHtml(obj.name)+' · ':''}${escapeHtml(w.intervall)}</p><p style="margin: 6px 0 0; font-size: 12.5px;">${w.naechster} · ${tageText}</p>${w.notiz?`<p style="margin: 8px 0 0; font-size: 12px; color: var(--text-3);">${escapeHtml(w.notiz)}</p>`:''}</div>`;
    }).join('')}</div>`}`;
}

function renderModal() {
  const old = document.getElementById('modal-host'); if (old) old.remove();
  if (!modalOpen) return;
  let html = '';
  if (modalOpen.type==='detail') html = renderSchadenDetail(modalOpen.id);
  else if (modalOpen.type==='neu') html = renderSchadenForm(modalOpen.prefill||{});
  else if (modalOpen.type==='handwerker-neu') html = renderHandwerkerForm();
  else if (modalOpen.type==='wartung-neu') html = renderWartungForm();
  const host = document.createElement('div'); host.id = 'modal-host';
  host.innerHTML = `<div class="modal-bg" id="modal-bg"><div class="modal">${html}</div></div>`;
  document.body.appendChild(host);
  bindModalHandlers();
}

function renderSchadenDetail(id) {
  const s = state.schaeden.find(x=>x.id===id);
  if (!s) return '';
  const obj = findObjekt(s.objektId);
  const ein = findEinheit(s.objektId, s.einheitId);
  const hw = findHandwerker(s.handwerkerId);
  const statusBadge = s.status==='offen'?'<span class="badge b-offen">Offen</span>':s.status==='in_bearbeitung'?'<span class="badge b-progress">In Bearbeitung</span>':'<span class="badge b-erledigt">Erledigt</span>';
  const prioBadge = s.prioritaet==='dringend'?'<span class="badge b-dringend">Dringend</span>':s.prioritaet==='mittel'?'<span class="badge b-mittel">Mittel</span>':'<span class="badge b-niedrig">Niedrig</span>';
  return `
    <div class="modal-head"><h2 class="modal-title">${escapeHtml(s.titel)}</h2><button class="icon-btn" data-modal-action="close"><svg class="ti"><use href="#i-x"/></svg></button></div>
    <div class="badges" style="margin-bottom: 14px;">${prioBadge}${statusBadge}</div>
    <p class="modal-section-label">Objekt & Einheit</p>
    <p class="modal-section-value">${obj?(obj.emoji||'🏠')+' '+escapeHtml(obj.name):'?'} · ${escapeHtml(ein?ein.bez:'?')}<br><span style="font-size: 12.5px; color: var(--text-2);">Mieter: ${escapeHtml(ein?ein.mieter:'')}</span></p>
    <p class="modal-section-label">Beschreibung</p>
    <p class="modal-section-value">${escapeHtml(s.beschreibung)||'<i style="color: var(--text-3);">Keine</i>'}</p>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
      <div><p class="modal-section-label">Kategorie</p><p class="modal-section-value">${escapeHtml(s.kategorie)}</p></div>
      <div><p class="modal-section-label">Kosten</p><p class="modal-section-value">${fmtEuroInt(s.kosten||0)}</p></div>
    </div>
    <p class="modal-section-label">Handwerker</p>
    <p class="modal-section-value">${hw?escapeHtml(hw.name):'<i style="color: var(--text-3);">Nicht zugewiesen</i>'}</p>
    <p class="modal-section-label">Fotos (${(s.fotos||[]).length})</p>
    <div class="photo-grid" id="photo-grid-${s.id}">
      ${(s.fotos||[]).map((f,i)=>`<img src="${fotoUrl(f)}" class="photo-thumb" data-action="view-photo" data-id="${s.id}" data-idx="${i}" alt="" />`).join('')}
      <label class="photo-add" title="Foto hinzufügen"><svg class="ti"><use href="#i-cam"/></svg><input type="file" accept="image/*" capture="environment" data-action="add-photo" data-id="${s.id}" /></label>
    </div>
    <p class="modal-section-label">Verlauf</p>
    <div class="timeline">${(s.historie||[]).map(h=>`<div class="timeline-entry"><p class="timeline-date">${h.datum}</p>${escapeHtml(h.text)}</div>`).join('')}</div>
    <div class="actions">
      ${s.status!=='in_bearbeitung'?`<button class="btn" data-modal-action="set-status" data-id="${s.id}" data-status="in_bearbeitung">In Bearbeitung</button>`:''}
      ${s.status!=='erledigt'?`<button class="btn" data-modal-action="set-status" data-id="${s.id}" data-status="erledigt">Erledigt</button>`:''}
      ${s.status==='erledigt'?`<button class="btn" data-modal-action="set-status" data-id="${s.id}" data-status="offen">Wieder öffnen</button>`:''}
      <button class="btn" data-modal-action="add-cost" data-id="${s.id}"><svg class="ti"><use href="#i-coin"/></svg> Kosten</button>
      <button class="btn" data-modal-action="add-note" data-id="${s.id}"><svg class="ti"><use href="#i-note"/></svg> Notiz</button>
      <button class="btn btn-danger" data-modal-action="delete-schaden" data-id="${s.id}"><svg class="ti"><use href="#i-trash"/></svg></button>
    </div>`;
}

function renderSchadenForm(prefill) {
  const objId = prefill.objektId || (state.objekte[0] && state.objekte[0].id);
  const obj = findObjekt(objId);
  return `
    <div class="modal-head"><h2 class="modal-title">Neuer Schaden</h2><button class="icon-btn" data-modal-action="close"><svg class="ti"><use href="#i-x"/></svg></button></div>
    <form id="schaden-form">
      <div class="field"><label>Titel</label><input type="text" name="titel" required placeholder="z.B. Wasserschaden Bad" /></div>
      <div class="field"><label>Objekt</label><select name="objektId" id="form-objekt">${state.objekte.map(o=>`<option value="${o.id}" ${o.id===objId?'selected':''}>${o.emoji||'🏠'} ${escapeHtml(o.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Einheit</label><select name="einheitId" id="form-einheit">${obj?obj.einheiten.map(e=>`<option value="${e.id}" ${e.id===prefill.einheitId?'selected':''}>${escapeHtml(e.id)} · ${escapeHtml(e.bez)} (${escapeHtml(e.mieter)})</option>`).join(''):''}</select></div>
      <div class="field"><label>Kategorie</label><select name="kategorie"><option>Sanitär</option><option>Elektrik</option><option>Heizung</option><option>Fenster/Türen</option><option>Boden/Wand</option><option>Außenbereich</option><option>Sonstiges</option></select></div>
      <div class="field"><label>Priorität</label><select name="prioritaet"><option value="niedrig">Niedrig</option><option value="mittel" selected>Mittel</option><option value="dringend">Dringend</option></select></div>
      <div class="field"><label>Beschreibung</label><textarea name="beschreibung" rows="3" placeholder="Was ist genau los?"></textarea></div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;"><button type="button" class="btn" data-modal-action="close">Abbrechen</button><button type="submit" class="btn btn-primary">Anlegen</button></div>
    </form>`;
}

function renderHandwerkerForm() {
  return `
    <div class="modal-head"><h2 class="modal-title">Handwerker hinzufügen</h2><button class="icon-btn" data-modal-action="close"><svg class="ti"><use href="#i-x"/></svg></button></div>
    <form id="handwerker-form">
      <div class="field"><label>Name / Firma</label><input type="text" name="name" required /></div>
      <div class="field"><label>Gewerk</label><select name="gewerk"><option>Sanitär</option><option>Elektrik</option><option>Heizung</option><option>Maler</option><option>Tischler</option><option>Hausmeister</option><option>Sonstiges</option></select></div>
      <div class="field"><label>Telefon</label><input type="tel" name="tel" /></div>
      <div class="field"><label>Notizen</label><textarea name="notiz" rows="2"></textarea></div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;"><button type="button" class="btn" data-modal-action="close">Abbrechen</button><button type="submit" class="btn btn-primary">Speichern</button></div>
    </form>`;
}

function renderWartungForm() {
  return `
    <div class="modal-head"><h2 class="modal-title">Wartungstermin</h2><button class="icon-btn" data-modal-action="close"><svg class="ti"><use href="#i-x"/></svg></button></div>
    <form id="wartung-form">
      <div class="field"><label>Titel</label><input type="text" name="titel" required placeholder="z.B. Heizungswartung" /></div>
      <div class="field"><label>Objekt (optional)</label><select name="objektId"><option value="">Alle / Übergreifend</option>${state.objekte.map(o=>`<option value="${o.id}">${o.emoji||'🏠'} ${escapeHtml(o.name)}</option>`).join('')}</select></div>
      <div class="field"><label>Intervall</label><select name="intervall"><option>Jährlich</option><option>Halbjährlich</option><option>Quartalsweise</option><option>Einmalig</option></select></div>
      <div class="field"><label>Nächster Termin</label><input type="date" name="naechster" required /></div>
      <div class="field"><label>Notiz</label><textarea name="notiz" rows="2"></textarea></div>
      <div style="display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px;"><button type="button" class="btn" data-modal-action="close">Abbrechen</button><button type="submit" class="btn btn-primary">Speichern</button></div>
    </form>`;
}

function bindHandlers() {
  document.querySelectorAll('.sidebar > .nav-btn').forEach(b=>{
    b.onclick = ()=>{ currentView = b.dataset.view; currentObjektId = null; document.getElementById('sidebar').classList.remove('open'); render(); };
  });
  document.querySelectorAll('[data-action="new-schaden"]').forEach(b=>{ b.onclick = ()=>{ modalOpen={type:'neu'}; renderModal(); }; });
  document.querySelectorAll('[data-action="new-schaden-fuer-objekt"]').forEach(b=>{ b.onclick = ()=>{ modalOpen={type:'neu', prefill:{objektId:b.dataset.id}}; renderModal(); }; });
  document.querySelectorAll('[data-action="new-handwerker"]').forEach(b=>{ b.onclick = ()=>{ modalOpen={type:'handwerker-neu'}; renderModal(); }; });
  document.querySelectorAll('[data-action="new-wartung"]').forEach(b=>{ b.onclick = ()=>{ modalOpen={type:'wartung-neu'}; renderModal(); }; });
  document.querySelectorAll('[data-action="open-schaden"]').forEach(el=>{ el.onclick = ()=>{ modalOpen={type:'detail', id:el.dataset.id}; renderModal(); }; });
  document.querySelectorAll('[data-action="goto-objekt"]').forEach(el=>{
    el.onclick = ()=>{ currentView='objekt'; currentObjektId=el.dataset.id; expandedEinheit=null; render(); };
  });
  document.querySelectorAll('[data-action="goto-dashboard"]').forEach(el=>{ el.onclick = ()=>{ currentView='dashboard'; currentObjektId=null; render(); }; });
  document.querySelectorAll('[data-action="schaden-fuer"]').forEach(el=>{
    el.onclick = (e)=>{ e.stopPropagation(); modalOpen={type:'neu', prefill:{objektId:el.dataset.obj, einheitId:el.dataset.ein}}; renderModal(); };
  });
  document.querySelectorAll('[data-filter]').forEach(el=>{ el.onclick = ()=>{ listFilter=el.dataset.filter; render(); }; });
  document.querySelectorAll('[data-action="toggle-einheit"]').forEach(el=>{
    el.onclick = (e)=>{
      if (e.target.closest('button')) return;
      const id = el.dataset.id;
      expandedEinheit = expandedEinheit===id ? null : id;
      render();
    };
  });
}

function bindModalHandlers() {
  document.querySelectorAll('[data-modal-action="close"]').forEach(el=>{ el.onclick = ()=>{ modalOpen=null; renderModal(); }; });
  const bg = document.getElementById('modal-bg');
  if (bg) bg.onclick = (e)=>{ if(e.target===bg){ modalOpen=null; renderModal(); } };

  document.querySelectorAll('[data-modal-action="set-status"]').forEach(el=>{
    el.onclick = ()=>{
      const s = state.schaeden.find(x=>x.id===el.dataset.id); if (!s) return;
      s.status = el.dataset.status;
      const txt = el.dataset.status==='in_bearbeitung'?'Status: In Bearbeitung':el.dataset.status==='erledigt'?'Status: Erledigt':'Wieder geöffnet';
      s.historie = s.historie || []; s.historie.push({datum:heute(), text:txt});
      scheduleSyncSoon(); renderModal(); render();
    };
  });
  document.querySelectorAll('[data-modal-action="add-cost"]').forEach(el=>{
    el.onclick = ()=>{
      const s = state.schaeden.find(x=>x.id===el.dataset.id); if (!s) return;
      const v = prompt('Kosten in € (Gesamtsumme):', s.kosten||0);
      if (v===null) return;
      const num = parseFloat(v.replace(',','.'));
      if (!isNaN(num)){ s.kosten = num; s.historie = s.historie || []; s.historie.push({datum:heute(), text:`Kosten aktualisiert: ${fmtEuroInt(num)}`}); scheduleSyncSoon(); renderModal(); render(); }
    };
  });
  document.querySelectorAll('[data-modal-action="add-note"]').forEach(el=>{
    el.onclick = ()=>{
      const s = state.schaeden.find(x=>x.id===el.dataset.id); if (!s) return;
      const v = prompt('Notiz:'); if (!v) return;
      s.historie = s.historie || []; s.historie.push({datum:heute(), text:v});
      scheduleSyncSoon(); renderModal();
    };
  });
  document.querySelectorAll('[data-modal-action="delete-schaden"]').forEach(el=>{
    el.onclick = ()=>{
      if (!confirm('Schaden wirklich löschen?')) return;
      state.schaeden = state.schaeden.filter(s=>s.id!==el.dataset.id);
      scheduleSyncSoon(); modalOpen=null; renderModal(); render();
    };
  });
  document.querySelectorAll('[data-action="add-photo"]').forEach(el=>{
    el.onchange = async (e)=>{
      const file = e.target.files[0]; if (!file) return;
      const s = state.schaeden.find(x=>x.id===el.dataset.id); if (!s) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const max = 1280; let w = img.width, h = img.height;
          if (w>max || h>max){ if (w>h){ h = h*max/w; w = max; } else { w = w*max/h; h = max; } }
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          const grid = document.getElementById('photo-grid-' + s.id);
          if (grid) {
            const placeholder = document.createElement('div');
            placeholder.className = 'photo-uploading'; placeholder.innerHTML = '<div class="spinner"></div>';
            grid.insertBefore(placeholder, grid.querySelector('.photo-add'));
          }
          cv.toBlob(async (blob)=>{
            try {
              const result = await apiUploadFoto(blob, 'image/jpeg');
              s.fotos = s.fotos || []; s.fotos.push(result.id);
              s.historie = s.historie || []; s.historie.push({datum:heute(), text:'Foto hinzugefügt'});
              scheduleSyncSoon(); renderModal();
            } catch (err) {
              alert('Foto-Upload fehlgeschlagen: ' + err.message);
              if (grid) { const ph = grid.querySelector('.photo-uploading'); if (ph) ph.remove(); }
            }
          }, 'image/jpeg', 0.8);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
  });
  document.querySelectorAll('[data-action="view-photo"]').forEach(el=>{
    el.onclick = ()=>{
      const s = state.schaeden.find(x=>x.id===el.dataset.id); if (!s) return;
      const idx = parseInt(el.dataset.idx);
      window.open(fotoUrl(s.fotos[idx]), '_blank');
    };
  });

  const objSel = document.getElementById('form-objekt');
  if (objSel) objSel.onchange = ()=>{
    const obj = findObjekt(objSel.value);
    const einSel = document.getElementById('form-einheit');
    einSel.innerHTML = obj.einheiten.map(e=>`<option value="${e.id}">${escapeHtml(e.id)} · ${escapeHtml(e.bez)} (${escapeHtml(e.mieter)})</option>`).join('');
  };

  const sf = document.getElementById('schaden-form');
  if (sf) sf.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(sf);
    const ein = findEinheit(fd.get('objektId'), fd.get('einheitId'));
    const neuer = {
      id: uid(), titel: fd.get('titel'), beschreibung: fd.get('beschreibung'),
      objektId: fd.get('objektId'), einheitId: fd.get('einheitId'),
      kategorie: fd.get('kategorie'), prioritaet: fd.get('prioritaet'),
      status: 'offen', kosten: 0, handwerkerId: null, erstellt: heute(),
      fotos: [], historie: [{datum:heute(), text:`Schaden angelegt${ein?' für '+ein.mieter:''}`}]
    };
    state.schaeden.unshift(neuer);
    scheduleSyncSoon(); modalOpen={type:'detail', id:neuer.id}; renderModal(); render();
  };

  const hf = document.getElementById('handwerker-form');
  if (hf) hf.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(hf);
    state.handwerker.push({ id: uid(), name: fd.get('name'), gewerk: fd.get('gewerk'), tel: fd.get('tel'), notiz: fd.get('notiz') });
    scheduleSyncSoon(); modalOpen=null; renderModal(); render();
  };

  const wf = document.getElementById('wartung-form');
  if (wf) wf.onsubmit = (e)=>{
    e.preventDefault();
    const fd = new FormData(wf);
    state.wartung.push({ id: uid(), titel: fd.get('titel'), objektId: fd.get('objektId')||null, intervall: fd.get('intervall'), naechster: fd.get('naechster'), notiz: fd.get('notiz') });
    scheduleSyncSoon(); modalOpen=null; renderModal(); render();
  };
}

if (localStorage.getItem(TOKEN_KEY)) { loadAndRender(); } else { showLogin(); }
</script>
