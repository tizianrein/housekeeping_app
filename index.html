<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f4f3ef">
<title>Immobilien-Verwaltung</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root {
  --bg:        #f4f3ef;
  --bg-panel:  #ffffff;
  --bg-soft:   #ecebe6;
  --ink:       #1a1a1a;
  --ink-soft:  #5a5a55;
  --ink-mute:  #8a8a83;
  --line:      #1a1a1a;
  --line-soft: #d6d4cc;

  --accent:        #c1272d;
  --accent-soft:   #f4d2d4;
  --accent-deep:   #7a1418;

  --info:          #1f4e79;
  --info-soft:     #cfe0ee;
  --warn:          #b87a00;
  --ok:            #2c7a4b;
  --ok-soft:       #d7efdf;

  --shadow-1: 0 1px 0 rgba(26,26,26,.06);
  --shadow-2: 0 12px 28px -16px rgba(26,26,26,.35);

  --radius: 4px;
  --radius-lg: 8px;

  --mono: "JetBrains Mono", monospace;
  --sans: "Inter Tight", system-ui, sans-serif;
  --display: "Fraunces", Georgia, serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--sans); font-size: 14px; line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}

/* ==============================================================
   Layout
   ============================================================== */
.app {
  display: grid; grid-template-columns: 260px 1fr 300px;
  height: 100vh; height: 100dvh;
}
@media (max-width: 1100px) { .app { grid-template-columns: 220px 1fr 260px; } }

/* ==============================================================
   Toolbar (Left) & Sidebar (Right)
   ============================================================== */
.toolbar, .sidebar { background: var(--bg-panel); display: flex; flex-direction: column; overflow: hidden; }
.toolbar { border-right: 1px solid var(--line); }
.sidebar { border-left: 1px solid var(--line); }

.brand, .sidebar-head {
  display: flex; align-items: center; gap: 12px;
  padding: 18px 20px; border-bottom: 1px solid var(--line);
  background: var(--ink); color: var(--bg);
}
.brand-mark { font-size: 20px; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--bg); border-radius: 50%; }
.brand-title, .sidebar-head h2 { font-family: var(--display); font-size: 17px; margin: 0; flex: 1; font-weight: 500; }
.brand-sub { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); margin-top: 2px; }

.nav-menu, .sidebar-list { flex: 1; overflow-y: auto; padding: 12px 0; }
.sidebar-list { padding: 12px 14px; }

.nav-item {
  display: flex; align-items: center; gap: 12px; padding: 10px 20px; cursor: pointer;
  font-family: var(--sans); font-size: 14px; font-weight: 500; color: var(--ink-soft);
  border-left: 3px solid transparent; user-select: none;
}
.nav-item:hover { background: var(--bg-soft); color: var(--ink); }
.nav-item.active { background: var(--bg-soft); color: var(--ink); border-left-color: var(--accent); }

.immo-row {
  padding: 10px 12px; margin-bottom: 8px;
  border: 1px solid var(--line-soft); border-radius: var(--radius);
  background: var(--bg-soft); cursor: pointer;
  display: flex; align-items: center; gap: 10px;
  transition: border-color .15s, background .15s;
}
.immo-row:hover { border-color: var(--ink); background: var(--bg-panel); }
.immo-emoji { font-size: 20px; line-height: 1; }
.immo-name { font-weight: 600; font-size: 13px; flex: 1; }
.immo-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); }

/* ==============================================================
   Center Viewer
   ============================================================== */
.viewer { background: var(--bg); overflow-y: auto; padding: 24px 32px calc(80px + env(safe-area-inset-bottom)); }
.section-title { font-family: var(--display); font-size: 22px; font-weight: 500; margin: 0 0 16px; display: flex; justify-content: space-between; align-items: center; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat { background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: var(--radius-lg); padding: 16px; }
.stat-label { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: 0.04em; margin: 0; }
.stat-value { font-family: var(--sans); font-size: 24px; font-weight: 600; margin: 4px 0 0; }
.stat-value.danger { color: var(--accent); }

/* Cards & Badges */
.card {
  background: var(--bg-panel); border: 1px solid var(--line-soft);
  border-radius: var(--radius-lg); padding: 16px; margin-bottom: 12px;
  position: relative; transition: border-color .12s, box-shadow .12s;
}
.card.clickable { cursor: pointer; }
.card.clickable:hover { border-color: var(--ink); box-shadow: var(--shadow-2); }
.card-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
.card-title { font-weight: 600; font-size: 15px; margin: 0; flex: 1; }
.card-meta { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin: 2px 0 0; }

.badges { display: flex; gap: 4px; flex-wrap: wrap; }
.badge { font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; padding: 2px 6px; border-radius: 3px; letter-spacing: 0.04em; border: 1px solid transparent; }
.b-offen { background: var(--warn); color: white; }
.b-progress { background: var(--info-soft); color: var(--info); border-color: var(--info); }
.b-erledigt { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.b-dringend { background: #fee2e2; color: #b91c1c; border-color: #f87171; }
.b-mittel { background: #fef3c7; color: #b45309; border-color: #fbbf24; }
.b-niedrig { background: #f3f4f6; color: #4b5563; border-color: #d1d5db; }

/* Filter & Search Bar */
.tool-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; background: var(--bg-panel); padding: 12px; border-radius: var(--radius-lg); border: 1px solid var(--line-soft); }
.tool-bar input[type="search"] { flex: 1; min-width: 200px; }
.tool-bar select { width: auto; }

.filters { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.filters::-webkit-scrollbar { display: none; }
.pill { padding: 6px 12px; font-family: var(--mono); font-size: 11px; font-weight: 500; border: 1px solid var(--line-soft); background: var(--bg-panel); border-radius: 99px; cursor: pointer; color: var(--ink-soft); white-space: nowrap; }
.pill:hover { border-color: var(--ink); color: var(--ink); }
.pill.active { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Objekte & Einheiten */
.obj-card { background: var(--bg-panel); border: 1px solid var(--line-soft); border-radius: var(--radius-lg); margin-bottom: 12px; overflow: hidden; }
.obj-head { padding: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; }
.obj-head:hover { background: var(--bg-soft); }
.obj-name { font-weight: 600; font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
.obj-stats { font-family: var(--mono); font-size: 11px; color: var(--ink-soft); margin: 4px 0 0; }
.obj-chev { font-size: 16px; color: var(--ink-mute); transition: transform 0.2s; }
.obj-card.expanded .obj-chev { transform: rotate(90deg); }
.obj-body { display: none; padding: 0 16px 16px; border-top: 1px solid var(--line-soft); }
.obj-card.expanded .obj-body { display: block; }
.obj-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line-soft); margin-bottom: 8px; }
.obj-summary-label { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); margin: 0; text-transform: uppercase; }
.obj-summary-value { font-family: var(--mono); font-size: 13px; font-weight: 600; margin: 2px 0 0; }

.einheit { padding: 12px 0; border-top: 1px solid var(--line-soft); cursor: pointer; }
.einheit:first-of-type { border-top: none; }
.einheit-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.einheit-name { font-weight: 600; font-size: 13px; }
.einheit-mieter { color: var(--ink-soft); font-size: 13px; margin: 2px 0 0; }
.einheit-stats { font-family: var(--mono); font-size: 11px; color: var(--ink-mute); margin: 4px 0 0; }

.einheit-detail { display: none; padding: 14px; background: var(--bg-soft); border-radius: var(--radius); margin: 10px 0 0; border: 1px solid var(--line-soft); }
.einheit.expanded .einheit-detail { display: block; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-bottom: 12px; }
.detail-grid-item .lbl { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); margin: 0; text-transform: uppercase; }
.detail-grid-item .val { font-family: var(--mono); font-size: 12px; font-weight: 600; margin: 2px 0 0; }

.empty { color: var(--ink-mute); font-family: var(--mono); font-size: 12px; text-align: center; padding: 40px 16px; border: 1px dashed var(--line-soft); border-radius: var(--radius-lg); }

/* Buttons & Inputs */
.btn {
  font-family: var(--sans); font-size: 13px; font-weight: 500;
  padding: 8px 14px; border: 1px solid var(--line); background: var(--bg-panel);
  color: var(--ink); cursor: pointer; border-radius: var(--radius);
  transition: background .12s, transform .08s; text-align: center; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
}
.btn:hover { background: var(--bg-soft); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.danger { color: var(--accent); border-color: var(--line-soft); }
.btn.danger:hover { border-color: var(--accent); background: var(--accent-soft); }
.btn.small { padding: 6px 10px; font-size: 12px; }
.btn.success { background: var(--ok); border-color: var(--ok); color: white; }
.btn.success:hover { background: #23633c; border-color: #23633c; }
.btn.info { background: var(--info); border-color: var(--info); color: white; }
.btn.info:hover { background: #163b5c; border-color: #163b5c; }

/* EXTRA GROSSER ADD-BUTTON */
.btn-add { font-size: 15px; padding: 10px 18px; font-weight: 600; box-shadow: 0 4px 12px rgba(193,39,45,.3); border-radius: var(--radius-lg); }
.btn-add .ti { font-size: 18px; }

input, select, textarea {
  width: 100%; font-family: var(--sans); font-size: 14px; padding: 10px 12px;
  border: 1px solid var(--line-soft); border-radius: var(--radius);
  background: var(--bg-panel); color: var(--ink); outline: none; transition: border-color .15s;
}
input:focus, select:focus, textarea:focus { border-color: var(--ink); }
textarea { resize: vertical; min-height: 80px; }

.icon-btn { border: 1px solid transparent; background: transparent; width: 32px; height: 32px; border-radius: var(--radius); cursor: pointer; font-size: 16px; color: var(--ink-soft); display: grid; place-items: center; }
.icon-btn:hover { background: var(--bg-soft); color: var(--ink); border-color: var(--line-soft); }

/* Modals */
.modal-bg { position: fixed; inset: 0; background: rgba(26,26,26,.6); z-index: 100; display: grid; place-items: center; padding: 24px; backdrop-filter: blur(3px); animation: fadeIn .15s ease-out; }
@keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
.modal { background: var(--bg-panel); border: 1px solid var(--line); border-radius: var(--radius-lg); width: 100%; max-width: 520px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: var(--shadow-2); overflow: hidden; }
.modal-head { padding: 18px 20px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; background: var(--ink); color: var(--bg); }
.modal-title { font-family: var(--display); font-size: 20px; font-weight: 500; margin: 0; }
.modal-head .icon-btn { color: var(--bg); border-color: transparent; }
.modal-head .icon-btn:hover { background: rgba(255,255,255,0.1); color: white; }
.modal-body { padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--line-soft); display: flex; gap: 10px; justify-content: flex-end; background: var(--bg-panel); }

/* Lightbox */
#lightbox { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:200; display:flex; align-items:center; justify-content:center; touch-action:none; }
#lightbox img { max-width:calc(100% - 80px); max-height:90vh; object-fit:contain; border-radius:4px; user-select:none; pointer-events:none; }
.lb-close { position:absolute; top:16px; right:16px; background:rgba(255,255,255,.15); border:none; color:#fff; width:44px; height:44px; border-radius:50%; font-size:20px; cursor:pointer; display:grid; place-items:center; }
.lb-nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(255,255,255,.15); border:none; color:#fff; width:48px; height:48px; border-radius:50%; font-size:28px; cursor:pointer; display:grid; place-items:center; }
.lb-prev { left:12px; } .lb-next { right:12px; }
.lb-counter { position:absolute; bottom:24px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,.65); font-size:12px; font-family:var(--mono); pointer-events:none; }

.field label { display: block; font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-mute); margin-bottom: 4px; }
.modal-section-label { font-family: var(--mono); font-size: 10px; color: var(--ink-mute); margin: 16px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; border-top: 1px solid var(--line-soft); padding-top: 16px; display: flex; justify-content: space-between; align-items: center; }
.modal-section-label:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.modal-section-value { margin: 0; font-size: 14px; }

.timeline { background: var(--bg-soft); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 4px 12px; margin-top: 6px; }
.timeline-entry { padding: 10px 0; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
.timeline-entry:last-child { border-bottom: none; }
.timeline-date { font-family: var(--mono); font-size: 10px; color: var(--ink-soft); margin: 0 0 2px; }

/* Mobile Drawers */
.drawer-close { display: none; }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
  .viewer { grid-column: 1; grid-row: 1; padding: 16px 16px calc(90px + env(safe-area-inset-bottom)); }
  .toolbar, .sidebar { position: fixed; top: 0; bottom: 0; width: min(86vw, 320px); z-index: 50; transition: transform .28s cubic-bezier(.2,.7,.2,1); box-shadow: 0 0 40px rgba(0,0,0,.25); overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: env(safe-area-inset-bottom); }
  .toolbar { left: 0; transform: translateX(-105%); border-right: 1px solid var(--line); }
  .sidebar { right: 0; transform: translateX(105%); border-left: 1px solid var(--line); }
  body.drawer-toolbar-open .toolbar { transform: translateX(0); }
  body.drawer-sidebar-open .sidebar { transform: translateX(0); }

  .drawer-backdrop { position: fixed; inset: 0; background: rgba(26,26,26,.45); z-index: 40; opacity: 0; pointer-events: none; transition: opacity .25s; }
  body.drawer-toolbar-open .drawer-backdrop, body.drawer-sidebar-open .drawer-backdrop { opacity: 1; pointer-events: auto; }

  .fab { position: fixed; bottom: calc(20px + env(safe-area-inset-bottom)); z-index: 30; width: 56px; height: 56px; border-radius: 50%; border: 1px solid var(--line); background: var(--ink); color: var(--bg); font-size: 24px; display: grid; place-items: center; cursor: pointer; box-shadow: 0 8px 24px rgba(0,0,0,.3); }
  .fab.fab-nav { left: calc(20px + env(safe-area-inset-left)); }
  .fab.fab-immo { right: calc(20px + env(safe-area-inset-right)); background: var(--bg-panel); color: var(--ink); }

  .drawer-close { display: inline-grid; place-items: center; width: 32px; height: 32px; background: transparent; border: 1px solid var(--bg); border-radius: var(--radius); color: inherit; cursor: pointer; font-size: 16px; margin-left: auto; }
  
  .modal-bg { padding: 0; align-items: stretch; }
  .modal { max-width: 100%; max-height: 100dvh; height: 100dvh; border-radius: 0; border: none; }
  .modal-head, .modal-body { padding: 14px 16px; }
  .modal-foot { padding: 12px 16px; }
  .schaden-foot .btn { padding: 8px 4px; font-size: 12px; gap: 4px; }
  .schaden-foot .btn .ti { width: 14px; height: 14px; }
}
@media (min-width: 901px) { .fab, .drawer-backdrop { display: none !important; } }

.ti { display: inline-block; width: 1em; height: 1em; vertical-align: -0.125em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
</style>
</head>
<body>

<div class="app">
  <aside class="toolbar" id="toolbar">
    <div class="brand">
      <div class="brand-mark">⌂</div>
      <div class="brand-text">
        <div class="brand-title">Immobilien</div>

<script>
// ============== BACKEND CONFIG ==============
const API_BASE = 'https://backend.familie-rein.workers.dev';
const TOKEN_KEY = 'immo_auth_token';

// ============== STATE ==============
let state = null; // wird vom Backend geladen
let currentView = 'schaeden';
let modalOpen = null;
let expandedObjekt = null; let expandedEinheit = null;
let syncTimer = null;
let syncStatus = 'idle';

// Filter State
let listFilter = 'alle';
let schadenSearch = '';
let schadenSort = 'neu';
let schadenFilterKat = 'alle';

// ============== API LAYER ==============
async function apiCall(path, options = {}) {
  const token = localStorage.getItem(TOKEN_KEY);
  const headers = { ...(options.headers || {}) };
  if (token) headers['Authorization'] = 'Bearer ' + token;
  if (options.body && typeof options.body === 'string') headers['Content-Type'] = 'application/json';
  const res = await fetch(API_BASE + path, { ...options, headers });
  if (res.status === 401) { localStorage.removeItem(TOKEN_KEY); showLogin(); throw new Error('Nicht angemeldet'); }
  if (!res.ok) { const err = await res.json().catch(()=>({ error: 'Server-Fehler' })); throw new Error(err.error || 'Fehler'); }
  return res;
}
async function apiLogin(password) {
  const res = await fetch(API_BASE + '/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password }) });
  if (!res.ok) { const err = await res.json().catch(()=>({})); throw new Error(err.error || 'Falsches Passwort'); }
  const data = await res.json();
  localStorage.setItem(TOKEN_KEY, data.token);
  return data;
}
async function apiGetState() { const res = await apiCall('/api/state'); return res.json(); }
async function apiPutState(s) { await apiCall('/api/state', { method:'PUT', body: JSON.stringify(s) }); }
async function apiUploadFoto(blob, contentType) {
  const res = await apiCall('/api/foto', { method:'POST', body: blob, headers:{'Content-Type': contentType } });
  return res.json();
}
function fotoUrl(id) { return API_BASE + '/api/foto/' + id; }

// Cache für authentifizierte Foto-Blob-URLs
const fotoBlobCache = {};
async function loadFotoBlob(id) {
  if (fotoBlobCache[id]) return fotoBlobCache[id];
  try {
    const res = await apiCall('/api/foto/' + id);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    fotoBlobCache[id] = url;
    return url;
  } catch(e) { return null; }
}
function loadAllFotos() {
  document.querySelectorAll('img[data-foto-id]').forEach(async img => {
    if (img.src && img.src.startsWith('blob:')) return;
    const id = img.dataset.fotoId;
    const url = await loadFotoBlob(id);
    if (url) img.src = url;
  });
}

async function openLightbox(schadenId, startIdx) {
  const s = state.schaeden.find(x=>x.id===schadenId); if (!s || !s.fotos.length) return;
  let idx = startIdx;
  const multi = s.fotos.length > 1;

  const el = document.createElement('div'); el.id = 'lightbox';
  el.innerHTML = `
    <button class="lb-close">✕</button>
    <button class="lb-nav lb-prev" style="display:${multi?'grid':'none'}">‹</button>
    <img id="lb-img" alt="Foto" />
    <button class="lb-nav lb-next" style="display:${multi?'grid':'none'}">›</button>
    <span class="lb-counter" id="lb-counter"></span>
  `;
  document.body.appendChild(el);

  async function show(i) {
    idx = ((i % s.fotos.length) + s.fotos.length) % s.fotos.length;
    document.getElementById('lb-counter').textContent = multi ? (idx+1)+' / '+s.fotos.length : '';
    const img = document.getElementById('lb-img'); img.style.opacity='0.4';
    const url = await loadFotoBlob(s.fotos[idx]);
    if (url) { img.src = url; img.style.opacity='1'; }
  }

  function close() { const lb = document.getElementById('lightbox'); if (lb) lb.remove(); document.removeEventListener('keydown', onKey); }

  function onKey(e) {
    if (e.key==='Escape') close();
    else if (e.key==='ArrowLeft') show(idx-1);
    else if (e.key==='ArrowRight') show(idx+1);
  }

  el.querySelector('.lb-close').onclick = close;
  el.querySelector('.lb-prev').onclick = ()=>show(idx-1);
  el.querySelector('.lb-next').onclick = ()=>show(idx+1);
  el.onclick = (e)=>{ if (e.target===el) close(); };

  let touchX = null;
  el.addEventListener('touchstart', e=>{ touchX = e.touches[0].clientX; }, {passive:true});
  el.addEventListener('touchend', e=>{
    if (touchX===null) return;
    const dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 50) show(dx < 0 ? idx+1 : idx-1);
  }, {passive:true});

  document.addEventListener('keydown', onKey);
  await show(startIdx);
}

// ============== SYNC ==============
function setSyncStatusBadge(s) {
  syncStatus = s;
  const el = document.getElementById('sync-badge'); if (!el) return;
  if (s==='syncing') { el.textContent = '⟳ Sync...'; el.style.color = 'var(--info)'; }
  else if (s==='error') { el.textContent = '⚠ Fehler'; el.style.color = 'var(--accent)'; }
  else if (s==='success') { el.textContent = '✓ Gespeichert'; el.style.color = 'var(--ok)'; }
  else { el.textContent = ''; }
}
async function syncToServer() {
  setSyncStatusBadge('syncing');
  try { await apiPutState(state); setSyncStatusBadge('success'); setTimeout(()=>{ if(syncStatus==='success') setSyncStatusBadge('idle'); }, 1500); }
  catch(e) { console.error('Sync:', e); setSyncStatusBadge('error'); }
}
function saveState() {
  // statt localStorage: an Backend senden (debounced)
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncToServer, 800);
}
function uid() { return 'id' + Date.now() + Math.floor(Math.random()*1000); }
function heute() { return new Date().toISOString().slice(0,10); }
function findObjekt(id) { return state.objekte.find(o=>o.id===id); }
function findEinheit(objId, einId) { const o = findObjekt(objId); return o ? o.einheiten.find(e=>e.id===einId) : null; }
function findHandwerker(id) { return state.handwerker.find(h=>h.id===id); }
function escapeHtml(s) { return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]); }
function fmtEuroInt(n) { return (n||0).toLocaleString('de-DE') + ' €'; }

function renderSchaeden() {
  let liste = state.schaeden.slice();
  
  // Search
    if (schadenSearch) {
      const q = schadenSearch.toLowerCase();
      liste = liste.filter(s => {
        const obj = findObjekt(s.objektId);
        const ein = findEinheit(s.objektId, s.einheitId);
        const objName = obj ? (obj.name || '').toLowerCase() : '';
        const mieter = ein ? (ein.mieter || '').toLowerCase() : '';
        return s.titel.toLowerCase().includes(q) || 
              (s.beschreibung||'').toLowerCase().includes(q) || 
              s.kategorie.toLowerCase().includes(q) || 
              objName.includes(q) ||
              mieter.includes(q);
      });
    }

  if (listFilter !== 'alle') liste = liste.filter(s => s.status === listFilter);

  if (schadenFilterKat !== 'alle') liste = liste.filter(s => s.kategorie === schadenFilterKat);
  
  // Sorting
  liste.sort((a,b) => {

    if(schadenSort==='prio') { const p={dringend:0, mittel:1, niedrig:2}; return p[a.prioritaet]-p[b.prioritaet]; }
    return 0;

  return `

    <div class="tool-bar">

        <option value="alt" ${schadenSort==='alt'?'selected':''}>Älteste zuerst</option>

        <option value="alle">Alle Kategorien</option>

        <option value="Elektrik" ${schadenFilterKat==='Elektrik'?'selected':''}>Elektrik</option>
        <option value="Heizung" ${schadenFilterKat==='Heizung'?'selected':''}>Heizung</option>
        <option value="Fenster/Türen" ${schadenFilterKat==='Fenster/Türen'?'selected':''}>Fenster/Türen</option>
        <option value="Boden/Wand" ${schadenFilterKat==='Boden/Wand'?'selected':''}>Boden/Wand</option>

function renderModal() {

  if (!modalOpen) return;
  let html = '';
  if (modalOpen.type==='detail') html = renderSchadenDetail(modalOpen.id);
  else if (modalOpen.type==='edit-schaden' || modalOpen.type==='neu') html = renderSchadenForm(modalOpen.prefill||{}, modalOpen.editId);
  else if (modalOpen.type==='handwerker-neu') html = renderHandwerkerForm();
  else if (modalOpen.type==='handwerker-edit') html = renderHandwerkerForm(modalOpen.id);
  else if (modalOpen.type==='wartung-neu') html = renderWartungForm();
  else if (modalOpen.type==='wartung-edit') html = renderWartungForm(modalOpen.id);
  else if (modalOpen.type==='edit-einheit') html = renderEinheitForm(modalOpen.objId, modalOpen.einId);
  else if (modalOpen.type==='neu-einheit') html = renderEinheitForm(modalOpen.objId, null);
  else if (modalOpen.type==='edit-objekt') html = renderObjektForm(modalOpen.id);
  else if (modalOpen.type==='neu-objekt') html = renderObjektForm(null);
  
  const host = document.createElement('div'); host.id = 'modal-host';
  host.innerHTML = `<div class="modal-bg" id="modal-bg"><div class="modal">${html}</div></div>`;
  document.body.appendChild(host); bindModalHandlers();
  loadAllFotos();
}

        <div><p class="modal-section-label">Kategorie</p><p class="modal-section-value">${escapeHtml(s.kategorie)}</p></div>
        <div><p class="modal-section-label">Kosten</p><p class="modal-section-value">${fmtEuroInt(s.kosten||0)}</p></div>
      </div>
      <p class="modal-section-label">Bearbeitung durch</p>
      <p class="modal-section-value">${bearbeiterTxt}</p>
      <p class="modal-section-label">Fotos (${s.fotos.length})</p>
      <div style="display:flex; flex-wrap:wrap; gap:8px; align-items:flex-start;">
        <label style="width:72px; height:72px; border:1px dashed var(--line-soft); border-radius:var(--radius); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; cursor:pointer; color:var(--ink-mute); font-size:20px; background:var(--bg-soft); flex-shrink:0;" title="Foto hinzufügen"><svg class="ti"><use href="#i-cam"/></svg><span style="font-size:9px; font-family:var(--mono); text-transform:uppercase; letter-spacing:.04em;">Foto</span><input type="file" accept="image/*" data-action="add-photo" data-id="${s.id}" style="display:none;" /></label>
        ${s.fotos.map((f,i)=>`<img data-foto-id="${f}" style="width:72px; height:72px; object-fit:cover; border-radius:var(--radius); border:1px solid var(--line-soft); cursor:pointer; background:var(--bg-soft); flex-shrink:0;" data-action="view-photo" data-id="${s.id}" data-idx="${i}" alt="Foto" />`).join('')}
      </div>
      <p class="modal-section-label">Verlauf</p>
      <div class="timeline">${s.historie.slice().reverse().map(h=>`<div class="timeline-entry"><p class="timeline-date">${h.datum}</p>${escapeHtml(h.text)}</div>`).join('')}</div>
    </div>
    <footer class="modal-foot schaden-foot" style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px 16px;">
      ${s.status!=='erledigt'?`<button class="btn success" data-modal-action="set-status" data-id="${s.id}" data-status="erledigt" style="justify-content:center;">✔ Erledigt</button>`:`<button class="btn" data-modal-action="set-status" data-id="${s.id}" data-status="offen" style="justify-content:center;">↩ Öffnen</button>`}
      <button class="btn" data-modal-action="delete-schaden" data-id="${s.id}" style="justify-content:center; color:var(--accent); border-color:var(--accent);"><svg class="ti"><use href="#i-trash"/></svg> Löschen</button>
      <button class="btn" data-modal-action="add-note" data-id="${s.id}" style="justify-content:center;"><svg class="ti"><use href="#i-note"/></svg> Kommentar</button>
      <button class="btn" data-modal-action="close" style="justify-content:center; background:var(--ink); color:var(--bg); border-color:var(--ink); font-weight:600;">Schließen</button>
    </footer>
  `;
}

// ============== EVENT HANDLERS ==============
function closeAllDrawers() { document.body.classList.remove('drawer-toolbar-open', 'drawer-sidebar-open'); }

function bindHandlers() {
  document.getElementById('fabNav').onclick = () => document.body.classList.add('drawer-toolbar-open');
  document.getElementById('fabImmo').onclick = () => document.body.classList.add('drawer-sidebar-open');
  document.getElementById('drawerBackdrop').onclick = closeAllDrawers;
  document.querySelectorAll('.drawer-close').forEach(btn => btn.onclick = closeAllDrawers);

  document.querySelectorAll('.nav-item').forEach(b=>{ b.onclick = ()=>{ currentView = b.dataset.view; closeAllDrawers(); render(); document.querySelector('.viewer').scrollTo(0,0); }; });

  document.querySelectorAll('[data-action="new-schaden"]').forEach(b=> b.onclick = ()=>{ modalOpen={type:'neu'}; renderModal(); });
  document.querySelectorAll('[data-action="new-handwerker"]').forEach(b=> b.onclick = ()=>{ modalOpen={type:'handwerker-neu'}; renderModal(); });
  document.querySelectorAll('[data-action="edit-handwerker"]').forEach(b=> b.onclick = ()=>{ modalOpen={type:'handwerker-edit', id:b.dataset.id}; renderModal(); });
  document.querySelectorAll('[data-action="delete-handwerker"]').forEach(b=> b.onclick = ()=>{
    const h = findHandwerker(b.dataset.id); if (!h) return;
    if (!confirm(`Handwerker "${h.name}" wirklich löschen?`)) return;
    state.handwerker = state.handwerker.filter(x=>x.id!==b.dataset.id);
    saveState(); render();
  });
  document.querySelectorAll('[data-action="new-wartung"]').forEach(b=> b.onclick = ()=>{ modalOpen={type:'wartung-neu'}; renderModal(); });
  document.querySelectorAll('[data-action="edit-wartung"]').forEach(b=> b.onclick = ()=>{ modalOpen={type:'wartung-edit', id:b.dataset.id}; renderModal(); });
  document.querySelectorAll('[data-action="delete-wartung"]').forEach(b=> b.onclick = ()=>{
    if (!confirm('Wartungstermin wirklich löschen?')) return;
    state.wartung = state.wartung.filter(x=>x.id!==b.dataset.id);
    saveState(); render();
  });
  document.querySelectorAll('[data-action="new-objekt"]').forEach(b=> b.onclick = ()=>{ modalOpen={type:'neu-objekt'}; renderModal(); });
  document.querySelectorAll('[data-action="edit-objekt"]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); modalOpen={type:'edit-objekt', id:b.dataset.id}; renderModal(); });
  document.querySelectorAll('[data-action="delete-objekt"]').forEach(b=> b.onclick = (e)=>{
    e.stopPropagation();
    const o = findObjekt(b.dataset.id); if (!o) return;
    const offen = state.schaeden.filter(s=>s.objektId===o.id).length;
    let msg = `Objekt "${o.name}" mit ${o.einheiten.length} Einheiten wirklich löschen?`;
    if (offen>0) msg += `\n\nACHTUNG: ${offen} zugehörige Schäden werden ebenfalls gelöscht!`;
    if (!confirm(msg)) return;
    state.objekte = state.objekte.filter(x=>x.id!==b.dataset.id);
    state.schaeden = state.schaeden.filter(s=>s.objektId!==b.dataset.id);
    state.wartung.forEach(w=>{ if(w.objektId===b.dataset.id) w.objektId = null; });
    if (expandedObjekt===b.dataset.id) expandedObjekt = null;
    saveState(); render();
  });
  document.querySelectorAll('[data-action="new-einheit"]').forEach(b=> b.onclick = (e)=>{ e.stopPropagation(); modalOpen={type:'neu-einheit', objId:b.dataset.id}; renderModal(); });
  document.querySelectorAll('[data-action="delete-einheit"]').forEach(b=> b.onclick = (e)=>{
    e.stopPropagation();
    const ein = findEinheit(b.dataset.obj, b.dataset.ein); if (!ein) return;
    const offen = state.schaeden.filter(s=>s.einheitId===ein.id).length;
    let msg = `Einheit "${ein.id} · ${ein.bez}" wirklich löschen?`;
    if (offen>0) msg += `\n\nACHTUNG: ${offen} zugehörige Schäden werden ebenfalls gelöscht!`;
    if (!confirm(msg)) return;
    const o = findObjekt(b.dataset.obj);
    o.einheiten = o.einheiten.filter(x=>x.id!==b.dataset.ein);
    state.schaeden = state.schaeden.filter(s=>!(s.objektId===b.dataset.obj && s.einheitId===b.dataset.ein));
    if (expandedEinheit===b.dataset.ein) expandedEinheit = null;
    saveState(); render();
  });
  document.querySelectorAll('[data-action="open-schaden"]').forEach(el=> el.onclick = ()=>{ modalOpen={type:'detail', id:el.dataset.id}; renderModal(); });
  document.querySelectorAll('[data-action="goto-objekt"]').forEach(el=> el.onclick = ()=>{ currentView='objekte'; expandedObjekt=el.dataset.id; expandedEinheit=null; closeAllDrawers(); render(); document.querySelector('.viewer').scrollTo(0,0); });
  document.querySelectorAll('[data-action="schaden-fuer"]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); modalOpen={type:'neu', prefill:{objektId:el.dataset.obj, einheitId:el.dataset.ein}}; renderModal(); });
  document.querySelectorAll('[data-action="edit-einheit"]').forEach(el=> el.onclick = (e)=>{ e.stopPropagation(); modalOpen={type:'edit-einheit', objId:el.dataset.obj, einId:el.dataset.ein}; renderModal(); });
  
  document.querySelectorAll('[data-filter]').forEach(el=> el.onclick = ()=>{ listFilter=el.dataset.filter; render(); });
  document.querySelectorAll('[data-action="toggle-objekt"]').forEach(el=> el.onclick = ()=>{ const id = el.dataset.id; expandedObjekt = expandedObjekt===id ? null : id; expandedEinheit = null; render(); });
  document.querySelectorAll('[data-action="toggle-einheit"]').forEach(el=> el.onclick = (e)=>{ if (e.target.closest('button')) return; const id = el.dataset.id; expandedEinheit = expandedEinheit===id ? null : id; render(); });

  // SUCHFELD: Cursor-Position retten, damit man flüssig tippen kann
  const inSearch = document.getElementById('input-search');
  if(inSearch) {
    inSearch.oninput = (e) => {
      const start = e.target.selectionStart;
      const end = e.target.selectionEnd;
      schadenSearch = e.target.value;
      render(); // DOM wird neugebaut
      
      const newSearch = document.getElementById('input-search');
      if(newSearch) {
        newSearch.focus();
        newSearch.setSelectionRange(start, end); // Cursor wieder an die richtige Stelle setzen!
      }
    };
  }
  
  const selSort = document.getElementById('sel-sort');
  if(selSort) selSort.onchange = (e) => { schadenSort = e.target.value; render(); };
  const selKat = document.getElementById('sel-kat');
  if(selKat) selKat.onchange = (e) => { schadenFilterKat = e.target.value; render(); };
}

function bindModalHandlers() {
  document.querySelectorAll('[data-modal-action="close"]').forEach(el=> el.onclick = ()=>{ modalOpen=null; renderModal(); });
  document.querySelectorAll('[data-modal-action="back-to-detail"]').forEach(el=> el.onclick = ()=>{ modalOpen={type:'detail', id:el.dataset.id}; renderModal(); });
  document.querySelectorAll('[data-modal-action="edit-schaden"]').forEach(el=> el.onclick = ()=>{ modalOpen={type:'edit-schaden', editId:el.dataset.id}; renderModal(); });

  const bg = document.getElementById('modal-bg'); if (bg) bg.onclick = (e)=>{ if(e.target===bg){ modalOpen=null; renderModal(); } };

  document.querySelectorAll('[data-modal-action="set-status"]').forEach(el=>{ el.onclick = ()=>{ const s = state.schaeden.find(x=>x.id===el.dataset.id); if (!s) return; s.status = el.dataset.status; s.historie.push({datum:heute(), text:el.dataset.status==='in_bearbeitung'?'In Bearbeitung':el.dataset.status==='erledigt'?'Erledigt':'Geöffnet'}); saveState(); renderModal(); render(); }; });
  document.querySelectorAll('[data-modal-action="add-note"]').forEach(el=>{ el.onclick = ()=>{ const s = state.schaeden.find(x=>x.id===el.dataset.id); if (!s) return; const v = prompt('Kommentar:'); if (!v) return; s.historie.push({datum:heute(), text:v}); saveState(); renderModal(); }; });
  document.querySelectorAll('[data-modal-action="delete-schaden"]').forEach(el=>{ el.onclick = ()=>{ if (!confirm('Schaden wirklich löschen?')) return; state.schaeden = state.schaeden.filter(s=>s.id!==el.dataset.id); saveState(); modalOpen=null; renderModal(); render(); }; });

  const formBtyp = document.getElementById('form-btyp');
  if (formBtyp) formBtyp.onchange = (e) => { document.getElementById('form-hw-wrap').style.display = e.target.value==='extern'?'block':'none'; };

  const objSel = document.getElementById('form-objekt');
  if (objSel) objSel.onchange = ()=>{ const obj = findObjekt(objSel.value); document.getElementById('form-einheit').innerHTML = obj.einheiten.map(e=>`<option value="${e.id}">${escapeHtml(e.id)} · ${escapeHtml(e.bez)} (${escapeHtml(e.mieter)})</option>`).join(''); };

  const sf = document.getElementById('schaden-form');
  if (sf) sf.onsubmit = (e)=>{
    e.preventDefault(); const fd = new FormData(sf); const editId = fd.get('editId');
    const objId = fd.get('objektId'); const einId = fd.get('einheitId');
    const bearb = fd.get('bearbeiterTyp'); const hwId = bearb==='extern' ? (fd.get('handwerkerId')||null) : null;
    if (editId) {
      const s = state.schaeden.find(x=>x.id===editId);
      s.titel = fd.get('titel'); s.objektId = objId; s.einheitId = einId; s.kategorie = fd.get('kategorie'); s.prioritaet = fd.get('prioritaet'); s.bearbeiterTyp = bearb; s.handwerkerId = hwId; s.beschreibung = fd.get('beschreibung');
      const kostenVal = parseFloat(fd.get('kosten')); if (!isNaN(kostenVal)) s.kosten = kostenVal;
      s.historie.push({datum:heute(), text:'Details bearbeitet'});
      saveState(); modalOpen={type:'detail', id:s.id};
    } else {
      const neuer = { id: uid(), titel: fd.get('titel'), beschreibung: fd.get('beschreibung'), objektId: objId, einheitId: einId, kategorie: fd.get('kategorie'), prioritaet: fd.get('prioritaet'), bearbeiterTyp: bearb, handwerkerId: hwId, status: 'offen', kosten: 0, erstellt: heute(), fotos: [], historie: [{datum:heute(), text:'Angelegt'}] };
      state.schaeden.unshift(neuer); saveState(); modalOpen={type:'detail', id:neuer.id};
    }
    renderModal(); render();
  };

  const ef = document.getElementById('einheit-form');
  if (ef) ef.onsubmit = (e)=>{
    e.preventDefault(); const fd = new FormData(ef);
    const objId = fd.get('objId'); const oldEinId = fd.get('einId'); const newEinId = fd.get('id_new');
    const isNew = !oldEinId;
    
    const data = {
      id: newEinId,
      bez: fd.get('bez'),
      typ: fd.get('typ'),
      mieter: fd.get('mieter'),
      m2: parseFloat(fd.get('m2'))||0
    };
    
    const o = findObjekt(objId);
    if (isNew) {
      if (o.einheiten.some(x=>x.id===newEinId)) { alert('Eine Einheit mit dieser ID existiert bereits.'); return; }
      o.einheiten.push(data);
    } else {
      const ein = findEinheit(objId, oldEinId);
      Object.assign(ein, data);
      if(oldEinId !== newEinId) { state.schaeden.forEach(s => { if(s.objektId===objId && s.einheitId===oldEinId) s.einheitId = newEinId; }); }
    }
    saveState(); modalOpen=null; renderModal(); render();
  };

  const hf = document.getElementById('handwerker-form');
  if (hf) hf.onsubmit = (e)=>{
    e.preventDefault(); const fd = new FormData(hf); const editId = fd.get('editId');
    if (editId) {
      const h = findHandwerker(editId);
      h.name = fd.get('name'); h.gewerk = fd.get('gewerk'); h.tel = fd.get('tel'); h.notiz = fd.get('notiz');
    } else {
      state.handwerker.push({ id: uid(), name: fd.get('name'), gewerk: fd.get('gewerk'), tel: fd.get('tel'), notiz: fd.get('notiz') });
    }
    saveState(); modalOpen=null; renderModal(); render();
  };
  
  const wf = document.getElementById('wartung-form');
  if (wf) wf.onsubmit = (e)=>{
    e.preventDefault(); const fd = new FormData(wf); const editId = fd.get('editId');
    if (editId) {
      const w = state.wartung.find(x=>x.id===editId);
      w.titel = fd.get('titel'); w.objektId = fd.get('objektId')||null; w.intervall = fd.get('intervall'); w.naechster = fd.get('naechster'); w.notiz = fd.get('notiz');
    } else {
      state.wartung.push({ id: uid(), titel: fd.get('titel'), objektId: fd.get('objektId')||null, intervall: fd.get('intervall'), naechster: fd.get('naechster'), notiz: fd.get('notiz') });
    }
    saveState(); modalOpen=null; renderModal(); render();
  };
  
  const of = document.getElementById('objekt-form');
  if (of) of.onsubmit = (e)=>{
    e.preventDefault(); const fd = new FormData(of);
    const editId = fd.get('objId'); const newId = fd.get('id_new');
    if (editId) {
      const o = findObjekt(editId);
      o.name = fd.get('name'); o.adresse = fd.get('adresse'); o.emoji = fd.get('emoji')||'🏠';
    } else {
      // Eindeutigkeitsprüfung
      if (state.objekte.some(x=>x.id===newId)) { alert('Ein Objekt mit dieser ID existiert bereits.'); return; }
      state.objekte.push({ id: newId, name: fd.get('name'), adresse: fd.get('adresse'), emoji: fd.get('emoji')||'🏠', einheiten: [] });
    }
    saveState(); modalOpen=null; renderModal(); render();
  };
  
  // Photo Handling
  document.querySelectorAll('[data-action="add-photo"]').forEach(el=>{
    el.onchange = (e)=>{
      const file = e.target.files[0]; if (!file) return;
      const s = state.schaeden.find(x=>x.id===el.dataset.id); if (!s) return;
      const reader = new FileReader();
      reader.onload = (ev)=>{
        const img = new Image();
        img.onload = ()=>{
          const max = 1280; let w = img.width, h = img.height;
          if (w>max || h>max){ if (w>h){ h = h*max/w; w = max; } else { w = w*max/h; h = max; } }
          const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
          cv.getContext('2d').drawImage(img,0,0,w,h);
          cv.toBlob(async (blob)=>{
            try {
              const result = await apiUploadFoto(blob, 'image/jpeg');
              s.fotos.push(result.id); s.historie.push({datum:heute(), text:'Foto hinzugefügt'});
              saveState(); renderModal();
            } catch(err) {
              alert('Foto-Upload fehlgeschlagen: ' + err.message);
            }
          }, 'image/jpeg', 0.8);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    };
  });
  document.querySelectorAll('[data-action="view-photo"]').forEach(el=>{
    el.onclick = ()=>{ openLightbox(el.dataset.id, parseInt(el.dataset.idx)); };
  });
}

// ============== LOGIN / STARTUP ==============
function showLogin() {
  state = null;
  document.querySelector('.app').style.display = 'none';
  document.querySelectorAll('.fab, .drawer-backdrop').forEach(el => el.style.display = 'none');
  let loginEl = document.getElementById('login-overlay');
  if (!loginEl) {
    loginEl = document.createElement('div');
    loginEl.id = 'login-overlay';
    loginEl.style.cssText = 'position:fixed; inset:0; background:var(--bg); display:grid; place-items:center; z-index:1000; padding:24px;';
    loginEl.innerHTML = `
      <div style="background:var(--bg-panel); border:1px solid var(--line); border-radius:var(--radius-lg); padding:32px; max-width:380px; width:100%; box-shadow:var(--shadow-2);">
        <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
          <div style="font-size:24px; width:40px; height:40px; display:grid; place-items:center; border:1px solid var(--ink); border-radius:50%; background:var(--ink); color:var(--bg);">⌂</div>
          <div>
            <div style="font-family:var(--display); font-size:20px; font-weight:500;">Immobilien</div>
            <div style="font-family:var(--mono); font-size:11px; color:var(--ink-mute);">Familie Rein GbR</div>
          </div>
        </div>
        <form id="login-form" style="display:flex; flex-direction:column; gap:14px;">
          <div class="field">
            <label>Passwort</label>
            <input type="password" id="pw" autocomplete="current-password" required autofocus />
          </div>
          <div id="login-error" style="display:none; background:var(--accent-soft); color:var(--accent-deep); padding:10px 14px; border-radius:var(--radius); font-size:13px;"></div>
          <button type="submit" class="btn primary" style="justify-content:center; padding:12px;">Anmelden</button>
        </form>
      </div>
    `;
    document.body.appendChild(loginEl);
  } else {
    loginEl.style.display = 'grid';
  }
  document.getElementById('login-form').onsubmit = async (e)=>{
    e.preventDefault();
    const pw = document.getElementById('pw').value;
    const errEl = document.getElementById('login-error');
    const btn = e.target.querySelector('button');
    errEl.style.display = 'none';
    btn.disabled = true; btn.textContent = 'Prüfe...';
    try { await apiLogin(pw); await loadAndStart(); }
    catch(err) { errEl.textContent = err.message || 'Anmeldung fehlgeschlagen'; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Anmelden'; }
  };
}

async function loadAndStart() {
  const loginEl = document.getElementById('login-overlay');
  if (loginEl) loginEl.style.display = 'none';
  document.querySelector('.app').style.display = '';
  document.getElementById('view-container').innerHTML = `<div style="display:flex; align-items:center; justify-content:center; min-height:60vh; color:var(--ink-mute); font-family:var(--mono);"><div style="width:24px; height:24px; border:2px solid var(--line-soft); border-top-color:var(--ink); border-radius:50%; animation:spin 0.8s linear infinite; margin-right:12px;"></div>Lade Daten...</div><style>@keyframes spin { to { transform: rotate(360deg); } }</style>`;
  try {
    state = await apiGetState();
    render();
    const lb = document.getElementById('logout-btn');
    if (lb) lb.onclick = ()=>{ localStorage.removeItem(TOKEN_KEY); showLogin(); };
  } catch(e) {
    if (e.message === 'Nicht angemeldet') return;
    document.getElementById('view-container').innerHTML = `<div style="padding:40px; text-align:center; color:var(--accent);">Fehler beim Laden: ${escapeHtml(e.message)}<br><br><button class="btn" onclick="loadAndStart()">Erneut versuchen</button></div>`;
  }
}
window.loadAndStart = loadAndStart;

if (localStorage.getItem(TOKEN_KEY)) { loadAndStart(); } else { showLogin(); }
</script>
